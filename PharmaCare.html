<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PharmaCare - Pharmacy Management System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232E7D32'%3E%3Cpath d='M12 2L4 7v6c0 5 3.5 9.7 8 11 4.5-1.3 8-6 8-11V7l-8-5zm-1 6h2v3h3v2h-3v3h-2v-3H8v-2h3V8z'/%3E%3C/svg%3E" />
<style>
:root{
  --primary:#2E7D32;--primary-dark:#1B5E20;--accent:#4CAF50;
  --bg:#F5F5F5;--card:#FFFFFF;--text:#222;--text-muted:#666;
  --border:#E0E0E0;--danger:#E53935;--warning:#FF9800;--info:#2196F3;--success:#4CAF50;
  --sidebar-bg:#1B5E20;--sidebar-text:#E8F5E9;--sidebar-active:#2E7D32;
  --header-bg:#FFFFFF;--shadow:0 2px 8px rgba(0,0,0,.08);--radius:8px;
}
.dark{
  --bg:#1A1A2E;--card:#16213E;--text:#E0E0E0;--text-muted:#9aa3c7;
  --border:#2a3553;--header-bg:#16213E;--sidebar-bg:#0F3460;--sidebar-text:#E8F5E9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
label{display:block;font-weight:500;margin-bottom:4px;color:var(--text);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:var(--bg);font-weight:600;color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px;position:sticky;top:0}
tr:hover td{background:rgba(46,125,50,.04)}
.dark tr:hover td{background:rgba(76,175,80,.08)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-weight:500;font-size:13px;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--card);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px}
.btn-icon:hover{background:var(--bg)}
/* Layout */
#app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);padding:0;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s}
.sidebar.collapsed{width:64px}
.sidebar-brand{padding:18px 16px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-brand .logo{width:32px;height:32px;background:#fff;border-radius:8px;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.sidebar.collapsed .brand-text{display:none}
.nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;color:var(--sidebar-text);cursor:pointer;border-left:3px solid transparent;font-size:13px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(255,255,255,.12);border-left-color:var(--accent)}
.nav-item .icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar.collapsed .nav-item .label{display:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{background:var(--header-bg);padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.header .pname{font-weight:700;font-size:16px;color:var(--primary)}
.header .clock{color:var(--text-muted);font-size:13px;margin-left:auto}
.global-search{position:relative;flex:1;max-width:380px}
.global-search input{padding-left:34px}
.global-search:before{content:"🔍";position:absolute;left:10px;top:50%;transform:translate(0,-50%);color:var(--text-muted)}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:6px;max-height:300px;overflow-y:auto;z-index:60;box-shadow:var(--shadow);margin-top:4px;display:none}
.search-results.open{display:block}
.search-results .item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.search-results .item:hover{background:var(--bg)}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:18px;position:relative}
.icon-btn:hover{background:var(--bg)}
.badge-dot{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:700;min-width:16px;text-align:center}
.content{padding:20px;max-width:100%}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px;color:var(--text)}
.page-sub{color:var(--text-muted);margin-bottom:18px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.card .card-icon{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.card h4{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.card .v{font-size:22px;font-weight:700;color:var(--text)}
.card .sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.card.gradient-green{background:linear-gradient(135deg,#2E7D32,#4CAF50);color:#fff}
.card.gradient-green h4,.card.gradient-green .v,.card.gradient-green .sub{color:#fff}
.card.gradient-blue{background:linear-gradient(135deg,#1976D2,#42A5F5);color:#fff}
.card.gradient-blue h4,.card.gradient-blue .v,.card.gradient-blue .sub{color:#fff}
.card.gradient-orange{background:linear-gradient(135deg,#E65100,#FF9800);color:#fff}
.card.gradient-orange h4,.card.gradient-orange .v,.card.gradient-orange .sub{color:#fff}
.card.gradient-red{background:linear-gradient(135deg,#C62828,#EF5350);color:#fff}
.card.gradient-red h4,.card.gradient-red .v,.card.gradient-red .sub{color:#fff}
.card.gradient-purple{background:linear-gradient(135deg,#6A1B9A,#AB47BC);color:#fff}
.card.gradient-purple h4,.card.gradient-purple .v,.card.gradient-purple .sub{color:#fff}
.card.gradient-teal{background:linear-gradient(135deg,#00695C,#26A69A);color:#fff}
.card.gradient-teal h4,.card.gradient-teal .v,.card.gradient-teal .sub{color:#fff}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;justify-content:space-between}
.panel-h h3{font-size:15px;font-weight:600}
.panel-b{padding:14px 16px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:14px}
.row.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.row.cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row.cols-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row.cols-6{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.fld{display:flex;flex-direction:column}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar > *{flex-shrink:0}
.toolbar .grow{flex:1;min-width:200px}
.bdg{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.bdg-green{background:#E8F5E9;color:#2E7D32}
.bdg-yellow{background:#FFF8E1;color:#F57C00}
.bdg-red{background:#FFEBEE;color:#C62828}
.bdg-orange{background:#FFE0B2;color:#E65100}
.bdg-dark{background:#37474F;color:#fff}
.bdg-blue{background:#E3F2FD;color:#1565C0}
.bdg-grey{background:#ECEFF1;color:#455A64}
.dark .bdg-green{background:rgba(76,175,80,.18);color:#A5D6A7}
.dark .bdg-yellow{background:rgba(255,152,0,.18);color:#FFCC80}
.dark .bdg-red{background:rgba(229,57,53,.18);color:#EF9A9A}
.dark .bdg-orange{background:rgba(255,152,0,.22);color:#FFCC80}
.dark .bdg-blue{background:rgba(33,150,243,.18);color:#90CAF9}
.dark .bdg-grey{background:rgba(176,190,197,.15);color:#CFD8DC}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:30px 14px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:780px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideDown .25s ease}
.modal.lg{max-width:960px}
.modal.sm{max-width:480px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:16px;font-weight:600}
.modal-b{padding:18px;max-height:75vh;overflow-y:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

.toast-wrap{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);color:var(--text);border-left:4px solid var(--primary);padding:12px 16px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:260px;max-width:380px;animation:slideIn .25s ease;font-size:13px;display:flex;align-items:center;gap:10px}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast.info{border-left-color:var(--info)}
.toast .ti{font-size:18px}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

.notif-panel{position:fixed;top:0;right:0;height:100vh;width:360px;max-width:90vw;background:var(--card);box-shadow:-4px 0 20px rgba(0,0,0,.18);z-index:900;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.notif-panel.open{transform:translateX(0)}
.notif-panel .h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.notif-panel .b{flex:1;overflow-y:auto;padding:8px}
.notif-item{padding:10px 12px;border-radius:6px;margin-bottom:6px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notif-item .nico{font-size:18px}
.notif-item.warn{background:#FFF8E1;color:#E65100}
.notif-item.danger{background:#FFEBEE;color:#C62828}
.notif-item.info{background:#E3F2FD;color:#1565C0}
.dark .notif-item.warn{background:rgba(255,152,0,.15);color:#FFCC80}
.dark .notif-item.danger{background:rgba(229,57,53,.15);color:#EF9A9A}
.dark .notif-item.info{background:rgba(33,150,243,.15);color:#90CAF9}

.calc-panel{position:fixed;bottom:80px;right:24px;width:260px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:12px;z-index:850;display:none}
.calc-panel.open{display:block}
.calc-disp{background:var(--bg);padding:10px;text-align:right;font-size:20px;font-weight:600;border-radius:6px;margin-bottom:8px;min-height:42px;overflow-x:auto}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-grid button{padding:12px 0;background:var(--bg);border-radius:6px;font-weight:600;font-size:14px}
.calc-grid button:hover{background:var(--border)}
.calc-grid .op{background:var(--primary);color:#fff}
.calc-grid .eq{background:var(--accent);color:#fff;grid-column:span 2}
.calc-fab{position:fixed;bottom:20px;right:24px;width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(46,125,50,.4);z-index:840}

.chart-wrap{padding:14px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:14px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--accent),var(--primary));border-radius:6px 6px 0 0;position:relative;min-height:4px;transition:opacity .2s}
.bar-chart .bar:hover{opacity:.85}
.bar-chart .bar .v{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;font-weight:600;color:var(--text)}
.bar-chart .bar .l{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-muted)}
.chart-labels{display:flex;justify-content:space-between;padding:24px 4px 4px;font-size:11px;color:var(--text-muted)}

.t-c{text-align:center}.t-r{text-align:right}.t-l{text-align:left}
.flex{display:flex}.flex-c{display:flex;align-items:center;gap:8px}.flex-b{display:flex;align-items:center;justify-content:space-between}
.gap-1{gap:6px}.gap-2{gap:10px}.gap-3{gap:16px}
.mt-1{margin-top:6px}.mt-2{margin-top:10px}.mt-3{margin-top:16px}.mt-4{margin-top:24px}
.mb-1{margin-bottom:6px}.mb-2{margin-bottom:10px}.mb-3{margin-bottom:16px}.mb-4{margin-bottom:24px}
.muted{color:var(--text-muted)}.bold{font-weight:600}.small{font-size:12px}
.danger{color:var(--danger)}.success-c{color:var(--success)}.warn{color:var(--warning)}
.required:after{content:" *";color:var(--danger)}
.hidden{display:none !important}
.divider{height:1px;background:var(--border);margin:14px 0}
.empty{padding:50px 20px;text-align:center;color:var(--text-muted)}
.empty .ico{font-size:42px;margin-bottom:10px}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);background:var(--card);font-size:13px}
.pagination .pages{display:flex;gap:4px}
.pagination .pages button{padding:5px 10px;border-radius:5px;background:var(--card);border:1px solid var(--border);font-size:12px}
.pagination .pages button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination .pages button:hover:not(.active){background:var(--bg)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);font-weight:500;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}

.login-bg{position:fixed;inset:0;background:linear-gradient(135deg,#2E7D32,#1B5E20);display:flex;align-items:center;justify-content:center;z-index:5000;padding:20px}
.login-card{background:#fff;color:#222;border-radius:16px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-card .logo{width:64px;height:64px;background:var(--primary);border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;margin:0 auto 14px}
.login-card h2{margin-bottom:6px}
.login-card .sub{color:#666;margin-bottom:20px;font-size:13px}

.wizard-step{padding:20px}
.wizard-prog{display:flex;justify-content:space-between;margin-bottom:20px;position:relative}
.wizard-prog:before{content:"";position:absolute;top:14px;left:14px;right:14px;height:2px;background:var(--border);z-index:0}
.wizard-prog .s{width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;z-index:1;font-size:13px}
.wizard-prog .s.done{background:var(--primary);color:#fff;border-color:var(--primary)}
.wizard-prog .s.active{border-color:var(--primary);color:var(--primary)}

.fade-in{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:-240px;z-index:200;transition:left .25s}
  .sidebar.open{left:0}
  .menu-toggle{display:inline-flex !important}
  .header .clock{display:none}
}
.menu-toggle{display:none}

/* Print styles */
@media print{
  body{background:#fff;color:#000}
  .sidebar,.header,.calc-fab,.calc-panel,.notif-panel,.toolbar,.btn,.pagination,.tabs{display:none !important}
  .content{padding:0}
  .panel,.card{box-shadow:none;border:none}
  .print-area{display:block !important}
  table{border:1px solid #000}
  th,td{border:1px solid #ccc !important;color:#000 !important}
}
.print-area{display:none}
.print-only{display:none}
@media print{.print-only{display:block}.no-print{display:none !important}}

/* Invoice */
.inv{font-family:Arial,sans-serif;color:#000;padding:24px;max-width:800px;margin:0 auto}
.inv h1{color:var(--primary);margin-bottom:4px}
.inv .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--primary);padding-bottom:12px;margin-bottom:14px}
.inv .head .right{text-align:right}
.inv table{width:100%;border-collapse:collapse;margin-top:14px}
.inv table th,.inv table td{border:1px solid #999;padding:6px 8px;font-size:12px;color:#000}
.inv .totals{margin-top:14px;display:flex;justify-content:flex-end}
.inv .totals table{width:300px}
.inv .totals td{border:none;padding:4px 8px}
.inv .totals .grand{font-size:16px;font-weight:700;background:var(--primary);color:#fff}
.inv .ftr{margin-top:30px;padding-top:14px;border-top:1px solid #999;text-align:center;font-size:11px;color:#444}

</style>
</head>
<body>

<div id="login-screen" class="login-bg hidden">
  <div class="login-card">
    <div class="logo">℞</div>
    <h2 id="login-pname">PharmaCare</h2>
    <p class="sub">Sign in to manage your pharmacy</p>
    <div style="text-align:left">
      <label>Username</label>
      <input id="login-user" type="text" placeholder="Username" />
      <label class="mt-2">Password</label>
      <input id="login-pass" type="password" placeholder="Password" />
    </div>
    <button class="btn btn-primary mt-3" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
    <p class="muted mt-2 small" id="login-hint" style="display:none"></p>
    <p class="small muted mt-2"><a href="#" onclick="event.preventDefault();showHint()">Forgot password?</a></p>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">℞</div>
      <span class="brand-text" id="brand-name">PharmaCare</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div style="padding:12px;font-size:11px;text-align:center;opacity:.6">v1.0 © PharmaCare</div>
  </aside>
  <main class="main">
    <div class="header">
      <button class="icon-btn menu-toggle" onclick="toggleSidebar()">☰</button>
      <span class="pname" id="header-pname">PharmaCare Pharmacy</span>
      <div class="global-search">
        <input id="g-search" type="text" placeholder="Search medicines..." oninput="globalSearch(this.value)" onblur="setTimeout(()=>document.getElementById('g-results').classList.remove('open'),200)" />
        <div class="search-results" id="g-results"></div>
      </div>
      <span class="clock" id="clock"></span>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">🌙</button>
      <button class="icon-btn" onclick="toggleNotif()" title="Notifications">
        🔔<span class="badge-dot hidden" id="notif-count">0</span>
      </button>
      <button class="icon-btn" onclick="lockScreen()" title="Lock" id="lock-btn">🔒</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="notif-panel" id="notif-panel">
  <div class="h">
    <h3>🔔 Notifications</h3>
    <button class="icon-btn" onclick="toggleNotif()">✕</button>
  </div>
  <div class="b" id="notif-body"></div>
</div>

<button class="calc-fab" onclick="toggleCalc()" title="Calculator">🧮</button>
<div class="calc-panel" id="calc-panel">
  <div class="calc-disp" id="calc-disp">0</div>

      <h3 id="modal-title">Title</h3>

    </div>
    <div class="modal-b" id="modal-body"></div>

  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<div class="print-area" id="print-area"></div>

<script>
/* ============================================================
   PharmaCare - Single File Pharmacy Management System
   Vanilla HTML/CSS/JS, LocalStorage persistence
   ============================================================ */

/* ---------- Storage ---------- */
const LS_KEY='pharmacare_v1';
const DEFAULT_STATE = ()=>({
  meds:[], sales:[], purchases:[], suppliers:[], customers:[], expenses:[],
  paymentsIn:[], paymentsOut:[], salesReturns:[], purchaseReturns:[],
  heldSales:[], audit:[], priceHistory:[], stockAdjustments:[],
  categories:['Tablets','Capsules','Syrup','Injection','Cream/Ointment','Drops','Inhaler','Sachets','Suspension','Powder','Gel','Suppository','Patch','Surgical Items','Medical Devices','Others'],
  units:['Pieces','Strips','Boxes','Bottles','Tubes','Packs','Vials','Sachets'],
  expenseCategories:['Rent','Electricity','Salary','Transport','Maintenance','Miscellaneous','Other'],
  cashRegister:{opening:0,date:''},
  notifications:[],
  reminders:[],
  setup:false,
  settings:{
    pname:'PharmaCare Pharmacy',
    address:'Main Bazaar, Karachi, Pakistan',
    phone:'+92-300-1234567',
    email:'info@pharmacare.pk',
    website:'',
    license:'PHARM-2024-001',
    ntn:'',
    regNo:'',
    pharmacist:'',
    logo:'',
    invoicePrefix:'INV-',
    invoiceStart:1,
    invoiceFormat:'A4',
    showBatch:true,showExpiry:true,showGeneric:false,showDiscount:true,showTax:true,
    defaultDiscount:0,defaultTax:0,
    invoiceFooter:'Thank you for your purchase! Goods once sold will not be taken back without valid reason.',
    returnPolicy:'Returns accepted within 7 days with original receipt for unopened items only.',
    currency:'₨',dateFormat:'DD/MM/YYYY',
    lowStockThreshold:10, nearExpiryDays:30,
    darkMode:false,
    sounds:true,
    autoBackupDays:7,lastBackup:'',
    loginEnabled:false,username:'',password:'',hint:'',
    medCounter:0,invCounter:0,purCounter:0,supCounter:0,custCounter:0,expCounter:0,payInCounter:0,payOutCounter:0
  }
});
let state = loadState();
let session = { locked:false, currentPage:'dashboard', filters:{}, page:1, perPage:25 };

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return DEFAULT_STATE();
    const s = JSON.parse(raw);
    const def = DEFAULT_STATE();
    return Object.assign(def, s, { settings: Object.assign(def.settings, s.settings||{}) });
  }catch(e){ console.error(e); return DEFAULT_STATE(); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('LocalStorage full or unavailable. Backup and clean old data.','error'); }
}
function audit(action, details){
  state.audit.unshift({ts:Date.now(), action, details, module:session.currentPage});
  if(state.audit.length>500) state.audit = state.audit.slice(0,500);
  saveState();
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const fmt = n => 'PKR ' + (Number(n)||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN = n => (Number(n)||0).toLocaleString('en-PK');
const today = ()=> new Date().toISOString().slice(0,10);
const now = ()=> new Date().toISOString();
const fmtDate = (d)=>{ if(!d) return '-'; const x = new Date(d); if(isNaN(x)) return d; const fmt=state.settings.dateFormat; const dd=String(x.getDate()).padStart(2,'0'); const mm=String(x.getMonth()+1).padStart(2,'0'); const yy=x.getFullYear(); return fmt==='DD/MM/YYYY'?`${dd}/${mm}/${yy}`:fmt==='MM/DD/YYYY'?`${mm}/${dd}/${yy}`:`${yy}-${mm}-${dd}`; };
const fmtDT = (ts)=>{ const d = new Date(ts); return fmtDate(d.toISOString().slice(0,10))+' '+d.toTimeString().slice(0,5); };
const uid = ()=> Math.random().toString(36).slice(2,10);
const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validatePhonePK = (p)=> !p || /^(\+92|0)?[0-9]{10,11}$/.test(String(p).replace(/[\s-]/g,''));
const daysBetween = (d)=>{ const a=new Date(d); const b=new Date(today()); return Math.ceil((a-b)/(1000*3600*24)); };

function toast(msg,type='info'){
  const w=$('toast-wrap'); const el=document.createElement('div');
  el.className='toast '+type;
  const icons={success:'✓',error:'⚠',warn:'⚠',info:'ℹ'};
  el.innerHTML=`<span class="ti">${icons[type]||'ℹ'}</span><span>${escapeHtml(msg)}</span>`;
  w.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3500);
  if(state.settings.sounds && type==='success'){ try{ playBeep(); }catch(e){} }
}
function playBeep(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value=880; g.gain.setValueAtTime(.05,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
  o.start(); o.stop(ctx.currentTime+.18);
}

function nextId(prefix, key){
  state.settings[key] = (state.settings[key]||0) + 1;
  return prefix + String(state.settings[key]).padStart(4,'0');
}

/* ---------- Modal ---------- */
function openModal(title, body, footer='', size=''){
  $('modal-title').innerHTML = title;
  $('modal-body').innerHTML = body;
  $('modal-footer').innerHTML = footer;
  $('modal').className = 'modal '+(size||'');
  $('modal-bg').classList.add('open');
}
function closeModal(){ $('modal-bg').classList.remove('open'); }
$('modal-bg').addEventListener('click',e=>{ if(e.target===$('modal-bg')) closeModal(); });
function confirmDialog(message, onYes){
  openModal('Confirm', `<p>${escapeHtml(message)}</p>`, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="(${onYes.toString()})();closeModal()">Confirm</button>
  `, 'sm');
}

/* ---------- Theme & Layout ---------- */
function toggleTheme(){
  state.settings.darkMode = !state.settings.darkMode;
  applyTheme(); saveState();
}
function applyTheme(){
  document.body.classList.toggle('dark', state.settings.darkMode);
  $('theme-btn').textContent = state.settings.darkMode ? '☀️':'🌙';
}
function toggleSidebar(){ $('sidebar').classList.toggle('open'); }

/* ---------- Clock ---------- */
function tickClock(){
  const d=new Date();
  $('clock').textContent = fmtDate(d.toISOString().slice(0,10))+' • '+d.toTimeString().slice(0,8);
}
setInterval(tickClock,1000);

/* ---------- Navigation ---------- */
const NAV = [
  {id:'dashboard',label:'Dashboard',icon:'📊'},
  {id:'medicines',label:'Medicines',icon:'💊'},
  {id:'pos',label:'New Sale (POS)',icon:'🛒'},
  {id:'sales',label:'Sales History',icon:'🧾'},
  {id:'held',label:'Held Sales',icon:'⏸️'},
  {id:'returns',label:'Sales Returns',icon:'↩️'},
  {id:'purchases',label:'Purchases',icon:'📦'},
  {id:'purchase-returns',label:'Purchase Returns',icon:'↪️'},
  {id:'suppliers',label:'Suppliers',icon:'🏭'},
  {id:'customers',label:'Customers',icon:'👥'},
  {id:'expiry',label:'Expiry Mgmt',icon:'⏰'},
  {id:'expenses',label:'Expenses',icon:'💸'},
  {id:'payments',label:'Payments',icon:'💳'},
  {id:'receivables',label:'Receivables/Payables',icon:'📒'},
  {id:'cash',label:'Cash Register',icon:'💰'},
  {id:'reports',label:'Reports',icon:'📈'},
  {id:'profit',label:'Profit & Loss',icon:'📉'},
  {id:'audit',label:'Activity Log',icon:'🕒'},
  {id:'backup',label:'Backup & Restore',icon:'🗄️'},
  {id:'settings',label:'Settings',icon:'⚙️'},
];
function renderNav(){
  $('nav').innerHTML = NAV.map(n=>`
    <div class="nav-item ${session.currentPage===n.id?'active':''}" onclick="go('${n.id}')">
      <span class="icon">${n.icon}</span><span class="label">${n.label}</span>
    </div>`).join('');
}
function go(page){
  session.currentPage = page; session.page=1; session.filters={};
  renderNav();
  const fn = pages[page] || pages.dashboard;
  $('content').innerHTML = `<div class="fade-in">${fn()}</div>`;
  if(window.innerWidth<=768) $('sidebar').classList.remove('open');
  if(typeof afterRender[page]==='function') afterRender[page]();
  window.scrollTo(0,0);
}

/* ---------- Status helpers ---------- */
function medStatus(m){
  const d = daysBetween(m.expiry);
  if(m.qty<=0) return {text:'Out of Stock',cls:'bdg-red'};
  if(d<0) return {text:'Expired',cls:'bdg-dark'};
  if(d<=state.settings.nearExpiryDays) return {text:'Near Expiry',cls:'bdg-orange'};
  if(m.qty<=(m.minStock||state.settings.lowStockThreshold)) return {text:'Low Stock',cls:'bdg-yellow'};
  return {text:'In Stock',cls:'bdg-green'};
}

/* ---------- Pages ---------- */
const pages = {};
const afterRender = {};

/* === Dashboard === */
pages.dashboard = ()=>{
  const totalMeds = state.meds.length;
  const stockValue = state.meds.reduce((s,m)=>s+(m.purchasePrice*m.qty),0);
  const stockSellValue = state.meds.reduce((s,m)=>s+(m.sellPrice*m.qty),0);
  const td = today();
  const todaySales = state.sales.filter(s=>s.date===td);
  const todayPurchases = state.purchases.filter(p=>p.date===td);
  const todaySalesAmt = todaySales.reduce((s,x)=>s+x.grandTotal,0);
  const todayPurchasesAmt = todayPurchases.reduce((s,x)=>s+x.grandTotal,0);
  const todayProfit = todaySales.reduce((s,x)=>s+(x.profit||0),0);
  const tm = td.slice(0,7);
  const monthSales = state.sales.filter(s=>s.date.slice(0,7)===tm);
  const monthSalesAmt = monthSales.reduce((s,x)=>s+x.grandTotal,0);
  const monthProfit = monthSales.reduce((s,x)=>s+(x.profit||0),0);
  const expired = state.meds.filter(m=>daysBetween(m.expiry)<0);
  const nearExp = state.meds.filter(m=>{const d=daysBetween(m.expiry);return d>=0 && d<=state.settings.nearExpiryDays});
  const outOfStock = state.meds.filter(m=>m.qty<=0);
  const lowStock = state.meds.filter(m=>m.qty>0 && m.qty<=(m.minStock||state.settings.lowStockThreshold));
  const receivables = state.customers.reduce((s,c)=>s+(c.balance||0),0);
  const payables = state.suppliers.reduce((s,c)=>s+(c.balance||0),0);

  // Last 7 days sales chart data
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const dayTotals = days.map(d => state.sales.filter(s=>s.date===d).reduce((a,b)=>a+b.grandTotal,0));
  const maxDay = Math.max(...dayTotals,1);

  return `
  <h1 class="page-title">Dashboard</h1>
  <p class="page-sub">Real-time overview of your pharmacy business</p>

  <div class="cards">
    ${dashCard('Total Medicines',fmtN(totalMeds),'In inventory','💊','gradient-green')}
    ${dashCard('Stock Value',fmt(stockValue),'At cost price','💰','gradient-teal')}
    ${dashCard('Today Sales',fmt(todaySalesAmt),todaySales.length+' invoices','🛒','gradient-blue')}
    ${dashCard('Today Purchases',fmt(todayPurchasesAmt),todayPurchases.length+' entries','📦','gradient-purple')}
    ${dashCard('Today Profit',fmt(todayProfit),'Revenue minus COGS','📈',todayProfit>=0?'gradient-green':'gradient-red')}
    ${dashCard('Monthly Sales',fmt(monthSalesAmt),'This month','📅','gradient-blue')}
    ${dashCard('Monthly Profit',fmt(monthProfit),'This month','💵','gradient-teal')}
    ${dashCard('Expired Meds',fmtN(expired.length),'Remove from stock','⏰','gradient-red')}
    ${dashCard('Near Expiry',fmtN(nearExp.length),`Within ${state.settings.nearExpiryDays} days`,'⚠️','gradient-orange')}
    ${dashCard('Out of Stock',fmtN(outOfStock.length),'Need restocking','📭','gradient-red')}
    ${dashCard('Low Stock',fmtN(lowStock.length),'Below minimum','📉','gradient-orange')}
    ${dashCard('Suppliers',fmtN(state.suppliers.length),'Total','🏭','gradient-purple')}
    ${dashCard('Customers',fmtN(state.customers.length),'Total','👥','gradient-blue')}
    ${dashCard('Receivables',fmt(receivables),'From customers','📒','gradient-orange')}
    ${dashCard('Payables',fmt(payables),'To suppliers','💳','gradient-red')}
  </div>

  <div class="row cols-2">
    <div class="panel">
      <div class="panel-h"><h3>📊 Sales — Last 7 Days</h3></div>
      <div class="chart-wrap">
        <div class="bar-chart">
          ${dayTotals.map((v,i)=>`<div class="bar" style="height:${(v/maxDay)*180}px" title="${fmt(v)}">
            <div class="v">${v>0?(v/1000).toFixed(1)+'k':''}</div>
            <div class="l">${days[i].slice(5)}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>🚨 Active Alerts</h3><span class="muted small">${expired.length+nearExp.length+outOfStock.length+lowStock.length} items</span></div>
      <div class="panel-b" style="max-height:260px;overflow-y:auto">
        ${expired.slice(0,3).map(m=>`<div class="notif-item danger"><span class="nico">⏰</span><div><strong>${escapeHtml(m.name)}</strong><br><span class="small">Expired ${fmtDate(m.expiry)}</span></div></div>`).join('')}
        ${nearExp.slice(0,3).map(m=>`<div class="notif-item warn"><span class="nico">⚠️</span><div><strong>${escapeHtml(m.name)}</strong><br><span class="small">Expires ${fmtDate(m.expiry)} (${daysBetween(m.expiry)} days)</span></div></div>`).join('')}
        ${outOfStock.slice(0,3).map(m=>`<div class="notif-item danger"><span class="nico">📭</span><div><strong>${escapeHtml(m.name)}</strong><br><span class="small">Out of stock</span></div></div>`).join('')}
        ${lowStock.slice(0,3).map(m=>`<div class="notif-item warn"><span class="nico">📉</span><div><strong>${escapeHtml(m.name)}</strong><br><span class="small">Only ${m.qty} left</span></div></div>`).join('')}
        ${expired.length+nearExp.length+outOfStock.length+lowStock.length===0?'<div class="empty"><div class="ico">✅</div>All systems healthy!</div>':''}
      </div>
    </div>
  </div>

  <div class="row cols-2">
    <div class="panel">
      <div class="panel-h"><h3>🧾 Recent Sales</h3><button class="btn btn-sm btn-secondary" onclick="go('sales')">View All →</button></div>
      <table>
        <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="t-r">Total</th></tr></thead>
        <tbody>
          ${state.sales.slice(0,10).map(s=>`<tr><td><strong>${s.id}</strong></td><td>${escapeHtml(s.customerName||'Walk-in')}</td><td>${fmtDate(s.date)}</td><td class="t-r bold">${fmt(s.grandTotal)}</td></tr>`).join('')}
          ${state.sales.length===0?'<tr><td colspan="4" class="empty">No sales yet. Go to POS to create one!</td></tr>':''}
        </tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>📦 Recent Purchases</h3><button class="btn btn-sm btn-secondary" onclick="go('purchases')">View All →</button></div>
      <table>
        <thead><tr><th>Purchase</th><th>Supplier</th><th>Date</th><th class="t-r">Total</th></tr></thead>
        <tbody>
          ${state.purchases.slice(0,10).map(s=>`<tr><td><strong>${s.id}</strong></td><td>${escapeHtml(s.supplierName||'-')}</td><td>${fmtDate(s.date)}</td><td class="t-r bold">${fmt(s.grandTotal)}</td></tr>`).join('')}
          ${state.purchases.length===0?'<tr><td colspan="4" class="empty">No purchases yet.</td></tr>':''}
        </tbody>
      </table>
    </div>
  </div>
  `;
};
function dashCard(title,val,sub,icon,grad){
  return `<div class="card ${grad||''}">
    <div class="card-icon" style="background:rgba(255,255,255,.25)">${icon}</div>
    <h4>${title}</h4>
    <div class="v">${val}</div>
    <div class="sub">${sub}</div>
  </div>`;
}

/* === Medicines === */
pages.medicines = ()=>{
  const filt = session.filters;
  let list = state.meds.slice();
  if(filt.q){
    const q=filt.q.toLowerCase();
    list = list.filter(m => (m.name||'').toLowerCase().includes(q) || (m.generic||'').toLowerCase().includes(q) || (m.batch||'').toLowerCase().includes(q) || (m.barcode||'').toLowerCase().includes(q) || (m.company||'').toLowerCase().includes(q));
  }
  if(filt.category) list = list.filter(m=>m.category===filt.category);
  if(filt.company) list = list.filter(m=>m.company===filt.company);
  if(filt.status){
    list = list.filter(m=>medStatus(m).text===filt.status);
  }
  const totalCount = list.length;
  const totalValue = list.reduce((s,m)=>s+m.purchasePrice*m.qty,0);
  // pagination
  const pp = session.perPage; const pages_ = Math.max(1,Math.ceil(totalCount/pp));
  if(session.page>pages_) session.page=1;
  const slice = list.slice((session.page-1)*pp, session.page*pp);
  const companies = [...new Set(state.meds.map(m=>m.company).filter(Boolean))];

  return `
  <h1 class="page-title">💊 Medicines / Inventory</h1>
  <p class="page-sub">Manage your medicine catalog and stock levels</p>

  <div class="toolbar">
    <input class="grow" placeholder="Search by name, generic, batch, barcode, company..." value="${escapeHtml(filt.q||'')}" oninput="setFilter('q',this.value)" />
    <select onchange="setFilter('category',this.value)">
      <option value="">All Categories</option>
      ${state.categories.map(c=>`<option ${filt.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
    </select>
    <select onchange="setFilter('company',this.value)">
      <option value="">All Companies</option>
      ${companies.map(c=>`<option ${filt.company===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
    </select>
    <select onchange="setFilter('status',this.value)">
      <option value="">All Status</option>
      <option ${filt.status==='In Stock'?'selected':''}>In Stock</option>
      <option ${filt.status==='Low Stock'?'selected':''}>Low Stock</option>
      <option ${filt.status==='Out of Stock'?'selected':''}>Out of Stock</option>
      <option ${filt.status==='Near Expiry'?'selected':''}>Near Expiry</option>
      <option ${filt.status==='Expired'?'selected':''}>Expired</option>
    </select>
    <button class="btn btn-primary" onclick="medForm()">+ Add Medicine</button>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Generic</th><th>Category</th><th>Batch</th><th>Expiry</th><th class="t-r">Cost</th><th class="t-r">MRP</th><th class="t-r">Profit</th><th class="t-r">Qty</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        ${slice.map(m=>{
          const st = medStatus(m);
          const profit = m.sellPrice - m.purchasePrice;
          return `<tr>
            <td><strong>${m.id}</strong></td>
            <td>${escapeHtml(m.name)}</td>
            <td>${escapeHtml(m.generic||'-')}</td>
            <td>${escapeHtml(m.category||'-')}</td>
            <td>${escapeHtml(m.batch||'-')}</td>
            <td>${fmtDate(m.expiry)}</td>
            <td class="t-r">${fmt(m.purchasePrice)}</td>
            <td class="t-r">${fmt(m.sellPrice)}</td>
            <td class="t-r ${profit>=0?'success-c':'danger'}">${fmt(profit)}</td>
            <td class="t-r"><strong>${m.qty}</strong></td>
            <td><span class="bdg ${st.cls}">${st.text}</span></td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="medView('${m.id}')">👁</button>
              <button class="btn btn-sm btn-secondary" onclick="medForm('${m.id}')">✏</button>
              <button class="btn btn-sm btn-danger" onclick="medDelete('${m.id}')">🗑</button>
            </td>
          </tr>`;
        }).join('')}
        ${slice.length===0?'<tr><td colspan="12" class="empty"><div class="ico">💊</div>No medicines found. Click "Add Medicine" to start.</td></tr>':''}
      </tbody>
    </table>
    <div class="pagination">
      <div>Showing <strong>${slice.length}</strong> of <strong>${totalCount}</strong> · Total Stock Value: <strong>${fmt(totalValue)}</strong></div>
      <div class="pages">
        <button onclick="setPage(${Math.max(1,session.page-1)})">◀</button>
        ${Array.from({length:Math.min(pages_,7)},(_,i)=>`<button class="${session.page===i+1?'active':''}" onclick="setPage(${i+1})">${i+1}</button>`).join('')}
        <button onclick="setPage(${Math.min(pages_,session.page+1)})">▶</button>
      </div>
    </div>
  </div>
  `;
};
function setFilter(k,v){ session.filters[k]=v; session.page=1; renderCurrent(); }
function setPage(n){ session.page=n; renderCurrent(); }
function renderCurrent(){ go(session.currentPage); }

function medForm(id){

function medCalc(){
  const f = $('medform'); if(!f) return;
  const p = parseFloat(f.purchasePrice.value)||0;
  const s = parseFloat(f.sellPrice.value)||0;
  const q = parseFloat(f.qty.value)||0;
  $('med-profit').value = fmt(s-p);
  $('med-margin').value = p?(((s-p)/p)*100).toFixed(2)+'%':'0%';
  $('med-stockval').value = fmt(p*q);
}
function readImg(input, targetId){
  const f = input.files[0]; if(!f) return;
  if(f.size>500000){ toast('Image too large (max 500KB)','warn'); input.value=''; return; }
  const r = new FileReader();
  r.onload = e => $(targetId).value = e.target.result;
  r.readAsDataURL(f);
}
function medSave(e, id){
  e.preventDefault();
  const f = e.target;
  const data = {
    name:f.name.value.trim(), generic:f.generic.value.trim(), category:f.category.value, type:f.type.value,
    company:f.company.value.trim(), supplier:f.supplier.value, batch:f.batch.value.trim(), barcode:f.barcode.value.trim(),
    expiry:f.expiry.value, mfg:f.mfg.value,
    purchasePrice:parseFloat(f.purchasePrice.value)||0, sellPrice:parseFloat(f.sellPrice.value)||0,
    wholesalePrice:parseFloat(f.wholesalePrice.value)||0, minSellPrice:parseFloat(f.minSellPrice.value)||0,
    discount:parseFloat(f.discount.value)||0, tax:parseFloat(f.tax.value)||0,
    qty:parseInt(f.qty.value)||0, minStock:parseInt(f.minStock.value)||0,
    unit:f.unit.value, storage:f.storage.value, rxRequired:f.rxRequired.value==='true',
    description:f.description.value.trim(), image:f.image.value, shelf:f.shelf.value.trim()
  };
  if(data.sellPrice<data.purchasePrice && !confirm('Selling price is less than purchase price. Continue?')) return false;
  if(daysBetween(data.expiry)<0 && !id && !confirm('Expiry date is in the past. Continue?')) return false;
  if(id){
    const m = state.meds.find(x=>x.id===id);
    const oldP = m.purchasePrice, oldS = m.sellPrice;
    Object.assign(m,data);
    if(oldP!==data.purchasePrice || oldS!==data.sellPrice){
      state.priceHistory.push({medId:id,medName:m.name,oldPurchase:oldP,newPurchase:data.purchasePrice,oldSell:oldS,newSell:data.sellPrice,date:now()});
    }
    audit('Edit Medicine', m.name);
    toast('Medicine updated successfully','success');
  } else {
    data.id = nextId('MED-','medCounter');
    data.createdAt = now();
    state.meds.push(data);
    audit('Add Medicine', data.name);
    toast('Medicine added: '+data.id,'success');
  }
  saveState(); checkNotifs();
  const again = f.dataset.again==='1';
  closeModal();
  renderCurrent();
  if(again) setTimeout(medForm,150);
  return false;
}
function medDelete(id){
  const m = state.meds.find(x=>x.id===id); if(!m) return;
  confirmDialog(`Delete medicine "${m.name}"? This cannot be undone.`, ()=>{
    state.meds = state.meds.filter(x=>x.id!==id);
    audit('Delete Medicine',m.name); saveState(); renderCurrent(); toast('Medicine deleted','success');
  });
}
function medView(id){
  const m = state.meds.find(x=>x.id===id); if(!m) return;
  const st = medStatus(m);
  const movements = [
    ...state.sales.flatMap(s=>s.items.filter(i=>i.medId===id).map(i=>({type:'Sale',date:s.date,ref:s.id,qty:-i.qty,price:i.unitPrice}))),
    ...state.purchases.flatMap(p=>p.items.filter(i=>i.medId===id).map(i=>({type:'Purchase',date:p.date,ref:p.id,qty:i.qty,price:i.purchasePrice})))
  ].sort((a,b)=>b.date.localeCompare(a.date));
  const totalSold = movements.filter(x=>x.type==='Sale').reduce((s,x)=>s+Math.abs(x.qty),0);
  const totalRevenue = movements.filter(x=>x.type==='Sale').reduce((s,x)=>s+(Math.abs(x.qty)*x.price),0);
  const profit = totalSold * (m.sellPrice - m.purchasePrice);

  const body = `
  <div id="med-detail-print">
    <div class="row cols-2">
      <div>
        ${m.image?`<img src="${m.image}" style="max-width:200px;border-radius:8px">`:'<div style="width:200px;height:140px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:48px">💊</div>'}
        <h3 class="mt-2">${escapeHtml(m.name)} <span class="bdg ${st.cls}">${st.text}</span></h3>
        <p class="muted">${escapeHtml(m.generic||'')}</p>
        <p><strong>ID:</strong> ${m.id}</p>
        <p><strong>Category:</strong> ${escapeHtml(m.category)} • ${escapeHtml(m.type)}</p>
        <p><strong>Company:</strong> ${escapeHtml(m.company||'-')}</p>
        <p><strong>Batch:</strong> ${escapeHtml(m.batch||'-')} | <strong>Barcode:</strong> ${escapeHtml(m.barcode||'-')}</p>
        <p><strong>Mfg:</strong> ${fmtDate(m.mfg)} | <strong>Expiry:</strong> ${fmtDate(m.expiry)}</p>
        <p><strong>Storage:</strong> ${escapeHtml(m.storage)} | <strong>Shelf:</strong> ${escapeHtml(m.shelf||'-')}</p>
        <p><strong>Rx Required:</strong> ${m.rxRequired?'Yes':'No'}</p>
        <p>${escapeHtml(m.description||'')}</p>
      </div>
      <div>
        <div class="cards">
          ${dashCard('Purchase Price',fmt(m.purchasePrice),'Per '+m.unit,'💰','gradient-teal')}
          ${dashCard('Selling Price',fmt(m.sellPrice),'MRP','💵','gradient-green')}
          ${dashCard('Profit/Unit',fmt(m.sellPrice-m.purchasePrice),m.purchasePrice?(((m.sellPrice-m.purchasePrice)/m.purchasePrice)*100).toFixed(1)+'%':'-','📈','gradient-blue')}
          ${dashCard('In Stock',fmtN(m.qty)+' '+m.unit,'Min: '+(m.minStock||0),'📦','gradient-purple')}
          ${dashCard('Stock Value',fmt(m.qty*m.purchasePrice),'At cost','📊','gradient-teal')}
          ${dashCard('Total Sold',fmtN(totalSold)+' units',fmt(totalRevenue),'🛒','gradient-blue')}
        </div>
      </div>
    </div>
    <h4 class="mt-3 mb-2">Stock Movement History</h4>
    <table>
      <thead><tr><th>Date</th><th>Type</th><th>Reference</th><th class="t-r">Qty</th><th class="t-r">Price</th></tr></thead>
      <tbody>
        ${movements.slice(0,30).map(x=>`<tr><td>${fmtDate(x.date)}</td><td><span class="bdg ${x.type==='Sale'?'bdg-blue':'bdg-green'}">${x.type}</span></td><td>${x.ref}</td><td class="t-r ${x.qty<0?'danger':'success-c'}">${x.qty>0?'+':''}${x.qty}</td><td class="t-r">${fmt(x.price)}</td></tr>`).join('')}
        ${movements.length===0?'<tr><td colspan="5" class="empty">No transactions yet</td></tr>':''}
      </tbody>
    </table>
  </div>
  `;
  openModal(`Medicine Details — ${m.id}`, body, `
    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    <button class="btn btn-secondary" onclick="printElement('med-detail-print','Medicine Details')">🖨 Print</button>
    <button class="btn btn-primary" onclick="closeModal();medForm('${m.id}')">✏ Edit</button>
  `, 'lg');
}

function posBillItemsHTML(){
  if(posBill.items.length===0) return '<tr><td colspan="9" class="empty">No items added yet</td></tr>';

    <td>${idx+1}</td>
    <td><strong>${escapeHtml(i.name)}</strong></td>
    <td>${escapeHtml(i.batch||'-')}</td>
    <td>${fmtDate(i.expiry)}</td>
    <td class="t-r"><input type="number" min="1" max="${i.available}" value="${i.qty}" style="width:60px" onchange="posUpdateItem(${idx},'qty',this.value)"></td>
    <td class="t-r">${fmt(i.unitPrice)}</td>
    <td class="t-r"><input type="number" min="0" max="100" step="0.01" value="${i.discount}" style="width:60px" onchange="posUpdateItem(${idx},'discount',this.value)"></td>
    <td class="t-r bold">${fmt(i.total)}</td>
    <td><button class="btn btn-sm btn-danger" onclick="posRemove(${idx})">✕</button></td>
  </tr>`).join('');
}
function posSummaryHTML(){
  const subtotal = posBill.items.reduce((s,i)=>s+i.total,0);
  let discount = 0;
  if(posBill.overallDiscountType==='pct') discount = subtotal * (posBill.overallDiscount/100);
  else discount = posBill.overallDiscount;
  const taxAmt = (subtotal-discount) * (posBill.tax/100);
  const grand = subtotal - discount + taxAmt;
  posBill.grandTotal = grand;
  posBill.subtotal = subtotal;
  posBill.discountAmt = discount;
  posBill.taxAmt = taxAmt;
  let amountPaid = parseFloat(posBill.amountPaid)||0;
  if(posBill.payMethod==='Mixed'){
    amountPaid = (parseFloat(posBill.mixed.cash)||0)+(parseFloat(posBill.mixed.card)||0)+(parseFloat(posBill.mixed.online)||0);
  } else if(posBill.payMethod==='Credit'){
    amountPaid = 0;
  }
  const change = amountPaid - grand;
  posBill.paid = amountPaid;
  posBill.change = change;

  return `
  <table style="width:100%">
    <tr><td>Subtotal</td><td class="t-r bold">${fmt(subtotal)}</td></tr>
    <tr><td>
      Overall Discount
      <select onchange="posBill.overallDiscountType=this.value;posRefreshSummary()" style="width:auto;padding:2px 4px;display:inline-block;width:60px">
        <option value="amt" ${posBill.overallDiscountType==='amt'?'selected':''}>₨</option>
        <option value="pct" ${posBill.overallDiscountType==='pct'?'selected':''}>%</option>
      </select>
      <input type="number" min="0" step="0.01" value="${posBill.overallDiscount}" style="width:80px;display:inline-block" oninput="posBill.overallDiscount=parseFloat(this.value)||0;posRefreshSummary()">
    </td><td class="t-r">-${fmt(discount)}</td></tr>
    <tr><td>Tax <input type="number" min="0" max="100" step="0.01" value="${posBill.tax}" style="width:60px;display:inline-block" oninput="posBill.tax=parseFloat(this.value)||0;posRefreshSummary()">%</td><td class="t-r">+${fmt(taxAmt)}</td></tr>
    <tr style="border-top:2px solid var(--primary)"><td><strong style="font-size:18px">Grand Total</strong></td><td class="t-r"><strong style="font-size:20px;color:var(--primary)">${fmt(grand)}</strong></td></tr>
  </table>
  <div class="divider"></div>
  <label>Payment Method</label>
  <select onchange="posBill.payMethod=this.value;posRefreshSummary()">
    ${['Cash','Credit/Debit Card','Online Transfer','Credit','Mixed'].map(p=>`<option ${posBill.payMethod===p?'selected':''}>${p}</option>`).join('')}
  </select>
  ${posBill.payMethod==='Mixed'?`
    <div class="row cols-3 mt-2">
      <div><label>Cash</label><input type="number" min="0" value="${posBill.mixed.cash}" oninput="posBill.mixed.cash=this.value;posRefreshSummary()"></div>
      <div><label>Card</label><input type="number" min="0" value="${posBill.mixed.card}" oninput="posBill.mixed.card=this.value;posRefreshSummary()"></div>
      <div><label>Online</label><input type="number" min="0" value="${posBill.mixed.online}" oninput="posBill.mixed.online=this.value;posRefreshSummary()"></div>
    </div>
  `:posBill.payMethod==='Credit'?`<p class="muted mt-2 small">⚠ Will be added to customer's pending balance.</p>`:`
    <label class="mt-2">Amount Paid (₨)</label>
    <input type="number" min="0" step="0.01" value="${posBill.amountPaid||grand.toFixed(2)}" oninput="posBill.amountPaid=this.value;posRefreshSummary()">
  `}
  <div class="row cols-2 mt-2">
    <div><strong>Amount Paid:</strong><br>${fmt(amountPaid)}</div>
    <div><strong>${change>=0?'Change':'Balance Due'}:</strong><br><span class="${change<0?'danger':'success-c'}" style="font-size:16px;font-weight:700">${fmt(Math.abs(change))}</span></div>

      <button class="btn btn-secondary" onclick="posPrintPreview()">🖨 Preview</button>

  `;

function posRefreshSummary(){
  const e = document.querySelector('#content .panel:last-child .panel-b');
  if(e) e.innerHTML = posSummaryHTML();
}
function posSetCustomer(id){
  if(id==='walkin'){ posBill.customer='walkin'; posBill.customerName='Walk-in Customer'; }
  else { const c = state.customers.find(x=>x.id===id); posBill.customer=id; posBill.customerName=c.name; }
}
function posSearch(q){
  const r = $('pos-suggest');
  if(!q || q.length<1){ r.classList.remove('open'); return; }
  const ql = q.toLowerCase();
  const matches = state.meds.filter(m => m.qty>0 && (
    (m.name||'').toLowerCase().includes(ql) ||
    (m.generic||'').toLowerCase().includes(ql) ||
    (m.batch||'').toLowerCase().includes(ql) ||
    (m.barcode||'').toLowerCase().includes(ql)
  )).slice(0,10);
  r.innerHTML = matches.length ? matches.map(m=>`<div class="item" onclick="posAdd('${m.id}')">
    <strong>${escapeHtml(m.name)}</strong> ${escapeHtml(m.generic?'• '+m.generic:'')}<br>
    <span class="small muted">Batch: ${escapeHtml(m.batch||'-')} • Exp: ${fmtDate(m.expiry)} • Stock: ${m.qty} • ${fmt(m.sellPrice)}</span>
  </div>`).join('') : '<div class="item muted">No medicines found in stock</div>';
  r.classList.add('open');
}
function posAdd(id){
  const m = state.meds.find(x=>x.id===id); if(!m) return;
  $('pos-search').value=''; $('pos-suggest').classList.remove('open');
  const existing = posBill.items.find(i=>i.medId===id);
  if(existing){
    if(existing.qty+1 > m.qty){ toast('Max stock reached','warn'); return; }
    existing.qty++;
    existing.total = existing.qty*existing.unitPrice*(1-existing.discount/100);
  } else {
    posBill.items.push({medId:m.id,name:m.name,batch:m.batch,expiry:m.expiry,unit:m.unit,unitPrice:m.sellPrice,purchasePrice:m.purchasePrice,qty:1,discount:m.discount||0,available:m.qty,total:m.sellPrice*(1-(m.discount||0)/100)});
  }
  posRefreshItems();
}
function posUpdateItem(idx,field,val){
  const i = posBill.items[idx]; if(!i) return;
  if(field==='qty'){
    const q = parseInt(val)||1;
    if(q>i.available){ toast('Not enough stock! Available: '+i.available,'warn'); return posRefreshItems(); }
    i.qty = q;
  } else if(field==='discount'){
    i.discount = parseFloat(val)||0;
  }
  i.total = i.qty * i.unitPrice * (1-(i.discount||0)/100);
  posRefreshItems();
}
function posRemove(idx){
  posBill.items.splice(idx,1); posRefreshItems();
}
function posRefreshItems(){
  $('pos-items').innerHTML = posBillItemsHTML();
  posRefreshSummary();
}
function posCancel(){
  if(posBill.items.length===0){ newBill(); go('pos'); return; }
  confirmDialog('Discard current bill?', ()=>{ newBill(); go('pos'); });
}
function posHold(){
  if(posBill.items.length===0){ toast('No items to hold','warn'); return; }
  state.heldSales.push({...posBill, heldAt:now(), id:'HOLD-'+uid()});
  saveState(); audit('Hold Sale', `${posBill.items.length} items`);
  newBill(); toast('Sale held','success'); go('pos');
}
function posComplete(){
  if(posBill.items.length===0){ toast('Add items first','warn'); return; }
  // Validate stock
  for(const i of posBill.items){
    const m = state.meds.find(x=>x.id===i.medId);
    if(!m || i.qty>m.qty){ toast(`Insufficient stock for ${i.name}`,'error'); return; }
  }
  if(posBill.payMethod!=='Credit' && posBill.paid < posBill.grandTotal && !confirm('Amount paid is less than total. Record difference as credit?')) return;

  const inv = {
    id: nextId(state.settings.invoicePrefix,'invCounter'),
    date: $('pos-date').value || today(),
    customer: posBill.customer,
    customerName: posBill.customerName,
    salesperson: $('pos-salesperson').value || '',
    items: posBill.items.map(i=>({medId:i.medId,name:i.name,batch:i.batch,expiry:i.expiry,unit:i.unit,qty:i.qty,unitPrice:i.unitPrice,purchasePrice:i.purchasePrice,discount:i.discount,total:i.total})),
    subtotal: posBill.subtotal,
    discountAmt: posBill.discountAmt,
    taxAmt: posBill.taxAmt,
    grandTotal: posBill.grandTotal,
    payMethod: posBill.payMethod,
    paid: posBill.paid,
    change: posBill.change,
    notes: posBill.notes,
    profit: posBill.items.reduce((s,i)=>s + (i.unitPrice-i.purchasePrice)*i.qty - (i.unitPrice*i.qty*(i.discount||0)/100), 0) - posBill.discountAmt,
    status: posBill.payMethod==='Credit' || posBill.paid<posBill.grandTotal ? (posBill.paid===0?'Credit':'Partial') : 'Paid',
    createdAt: now()
  };
  // reduce stock
  posBill.items.forEach(i=>{
    const m = state.meds.find(x=>x.id===i.medId);
    if(m) m.qty -= i.qty;
  });
  // customer balance
  if(inv.customer!=='walkin' && inv.status!=='Paid'){
    const c = state.customers.find(x=>x.id===inv.customer);
    if(c) c.balance = (c.balance||0) + (inv.grandTotal - inv.paid);
  }
  state.sales.unshift(inv);
  audit('Complete Sale', `${inv.id} - ${fmt(inv.grandTotal)}`);
  saveState(); checkNotifs();
  toast(`Sale completed: ${inv.id}`,'success');
  newBill();
  // Show invoice
  showInvoiceModal(inv.id);
}

  </div></div>

function pageBtns(total){
  const pp=session.perPage; const pgs=Math.max(1,Math.ceil(total/pp));
  let html='';
  html+=`<button onclick="setPage(${Math.max(1,session.page-1)})">◀</button>`;
  for(let i=1;i<=Math.min(pgs,7);i++) html+=`<button class="${session.page===i?'active':''}" onclick="setPage(${i})">${i}</button>`;
  html+=`<button onclick="setPage(${Math.min(pgs,session.page+1)})">▶</button>`;
  return html;
}

function processReturn(id){
  const inv = state.sales.find(s=>s.id===id); if(!inv) return;
  let totalRefund = 0;
  const items = [];
  inv.items.forEach((i,idx)=>{
    const q = parseInt(document.getElementById('ret-'+idx).value)||0;
    if(q>0){
      const refund = q * i.unitPrice * (1-(i.discount||0)/100);
      totalRefund += refund;
      items.push({...i, returnQty:q, refundAmt:refund});
      const m = state.meds.find(x=>x.id===i.medId);
      if(m) m.qty += q;
    }
  });
  if(items.length===0){ toast('Select at least one item','warn'); return; }
  const reason = document.getElementById('ret-reason').value;
  const method = document.getElementById('ret-method').value;
  state.salesReturns.unshift({id:'RET-'+uid(), invoiceId:id, date:today(), customer:inv.customer, customerName:inv.customerName, items, totalRefund, reason, method, createdAt:now()});
  audit('Sale Return', `${id} - ${fmt(totalRefund)}`);
  saveState(); closeModal(); toast('Return processed','success'); renderCurrent();
}

      <td><input type="number" min="0" step="0.01" value="${i.sellPrice}" oninput="purchaseBill.items[${idx}].sellPrice=parseFloat(this.value)||0;purchRender()" style="width:90px"></td>
      <td><input type="number" min="0" max="100" value="${i.discount}" oninput="purchaseBill.items[${idx}].discount=parseFloat(this.value)||0;purchRender()" style="width:60px"></td>
      <td><input type="number" min="0" max="100" value="${i.tax}" oninput="purchaseBill.items[${idx}].tax=parseFloat(this.value)||0;purchRender()" style="width:60px"></td>
      <td class="t-r bold">${fmt(total)}</td>

    </tr>`;
  }).join('') || '<tr><td colspan="10" class="empty">No items added yet</td></tr>';
  purchSummary();
}
function purchRemove(idx){ purchaseBill.items.splice(idx,1); purchRender(); }
function purchSummary(){
  const subtotal = purchaseBill.items.reduce((s,i)=>s+i.qty*i.purchasePrice,0);
  const discount = purchaseBill.items.reduce((s,i)=>s+i.qty*i.purchasePrice*i.discount/100,0);
  const tax = purchaseBill.items.reduce((s,i)=>s+(i.qty*i.purchasePrice*(1-i.discount/100))*i.tax/100,0);
  const grand = subtotal - discount + tax;
  const paid = parseFloat($('pur-paid')?.value)||0;
  const due = grand - paid;
  purchaseBill.subtotal=subtotal; purchaseBill.discount=discount; purchaseBill.tax=tax; purchaseBill.grand=grand; purchaseBill.paid=paid; purchaseBill.due=due;
  $('pur-summary').innerHTML = `
    <div style="background:var(--bg);padding:12px;border-radius:8px">
      <div class="flex-b"><span>Subtotal:</span><strong>${fmt(subtotal)}</strong></div>
      <div class="flex-b"><span>Discount:</span><strong>-${fmt(discount)}</strong></div>
      <div class="flex-b"><span>Tax:</span><strong>+${fmt(tax)}</strong></div>
      <div class="flex-b" style="border-top:1px solid var(--border);padding-top:6px;margin-top:6px"><strong>Grand Total:</strong><strong style="color:var(--primary);font-size:18px">${fmt(grand)}</strong></div>
      <div class="flex-b mt-1"><span>Amount Due:</span><strong class="${due>0?'danger':'success-c'}">${fmt(due)}</strong></div>
    </div>`;
}
function purchUpdate(){
  const status = $('pur-paystatus').value;
  if(status==='Paid') $('pur-paid').value = purchaseBill.grand?.toFixed(2)||'0';

}
function purchSave(){
  if(purchaseBill.items.length===0){ toast('Add items first','warn'); return; }
  const supplierId = $('pur-supplier').value;
  if(!supplierId){ toast('Select a supplier','warn'); return; }
  const sup = state.suppliers.find(x=>x.id===supplierId);
  for(const i of purchaseBill.items){
    if(!i.name.trim()){ toast('Medicine name required for all items','error'); return; }
    if(!i.expiry){ toast('Expiry date required for all items','error'); return; }
  }
  const id = nextId('PUR-','purCounter');
  // Apply stock changes & create medicines
  purchaseBill.items.forEach(i=>{
    if(i.isNew || !i.medId){
      // Try to merge by name+batch
      const exist = state.meds.find(m=>m.name.toLowerCase()===i.name.toLowerCase() && (m.batch||'')===i.batch);
      if(exist){
        exist.qty += i.qty;
        exist.purchasePrice = i.purchasePrice;
        exist.sellPrice = i.sellPrice;
        i.medId = exist.id;
      } else {
        const newMed = {id:nextId('MED-','medCounter'), name:i.name.trim(), generic:i.generic||'', category:i.category, type:'Allopathic', company:i.company||'', supplier:supplierId, batch:i.batch||'', barcode:'', expiry:i.expiry, mfg:i.mfg||'', purchasePrice:i.purchasePrice, sellPrice:i.sellPrice, wholesalePrice:0, minSellPrice:0, discount:0, tax:i.tax||0, qty:i.qty, minStock:state.settings.lowStockThreshold, unit:i.unit||'Pieces', shelf:'', storage:'Room Temperature', rxRequired:false, description:'', image:'', createdAt:now()};
        state.meds.push(newMed);
        i.medId = newMed.id;
      }
    } else {
      const m = state.meds.find(x=>x.id===i.medId);
      if(m){
        m.qty += i.qty;
        m.purchasePrice = i.purchasePrice;
        m.sellPrice = i.sellPrice;
        if(i.expiry) m.expiry = i.expiry;
        if(i.batch) m.batch = i.batch;
      }
    }
  });
  const purchase = {
    id, date:$('pur-date').value||today(), supplier:supplierId, supplierName:sup.name,
    invoiceNo:$('pur-billno').value, items:purchaseBill.items, subtotal:purchaseBill.subtotal,
    discountAmt:purchaseBill.discount, taxAmt:purchaseBill.tax, grandTotal:purchaseBill.grand,
    paid:purchaseBill.paid, due:purchaseBill.due,
    payStatus:$('pur-paystatus').value, payMethod:$('pur-paymethod').value, createdAt:now()
  };
  state.purchases.unshift(purchase);
  if(purchase.due>0){ sup.balance = (sup.balance||0) + purchase.due; }
  audit('Purchase', `${id} - ${fmt(purchase.grandTotal)}`);
  saveState(); checkNotifs();
  closeModal(); renderCurrent();
  toast('Purchase saved: '+id,'success');
}

function processPurchReturn(id){
  const p = state.purchases.find(x=>x.id===id);
  let total=0; const items=[];
  p.items.forEach((i,idx)=>{
    const q = parseInt(document.getElementById('pret-'+idx).value)||0;
    if(q>0){
      const amt = q*i.purchasePrice;
      total += amt;
      items.push({...i,returnQty:q,amount:amt});
      const m = state.meds.find(x=>x.id===i.medId);
      if(m) m.qty = Math.max(0, m.qty-q);
    }
  });
  if(items.length===0){ toast('Select items to return','warn'); return; }
  const reason = document.getElementById('pret-reason').value;
  state.purchaseReturns.unshift({id:'PRET-'+uid(),purchaseId:id,date:today(),supplier:p.supplier,supplierName:p.supplierName,items,total,reason,createdAt:now()});
  audit('Purchase Return',`${id} ${fmt(total)}`);
  saveState(); closeModal(); toast('Purchase return processed','success'); renderCurrent();
}

pages.expiry = ()=>{
  const groups = {expired:[],d7:[],d30:[],d90:[],ok:[]};
  state.meds.forEach(m=>{
    const d = daysBetween(m.expiry);
    if(d<0) groups.expired.push(m);
    else if(d<=7) groups.d7.push(m);
    else if(d<=30) groups.d30.push(m);
    else if(d<=90) groups.d90.push(m);
  });
  const renderGroup = (title, items, cls)=>`
    <div class="panel">
      <div class="panel-h"><h3>${title}</h3><span class="bdg ${cls}">${items.length}</span></div>
      ${items.length?`<table>
        <thead><tr><th>ID</th><th>Name</th><th>Batch</th><th>Expiry</th><th class="t-r">Qty</th><th class="t-r">Loss Value</th><th></th></tr></thead>
        <tbody>${items.map(m=>`<tr>
          <td>${m.id}</td><td>${escapeHtml(m.name)}</td><td>${escapeHtml(m.batch||'-')}</td><td>${fmtDate(m.expiry)} <span class="muted small">(${daysBetween(m.expiry)}d)</span></td><td class="t-r">${m.qty}</td><td class="t-r">${fmt(m.qty*m.purchasePrice)}</td>

        </tr>`).join('')}</tbody>
      </table>`:'<div class="empty">None</div>'}
    </div>`;
  return `
  <h1 class="page-title">⏰ Expiry Management</h1>
  <p class="page-sub">Track expired and expiring medicines</p>
  <div class="toolbar">
    <button class="btn btn-secondary" onclick="printElement('expiry-report','Expiry Report')">🖨 Print Expiry Report</button>
  </div>
  <div id="expiry-report">
    ${renderGroup('🔴 Already Expired', groups.expired, 'bdg-dark')}
    ${renderGroup('🟠 Expiring within 7 Days', groups.d7, 'bdg-red')}
    ${renderGroup('🟡 Expiring within 30 Days', groups.d30, 'bdg-orange')}
    ${renderGroup('🟢 Expiring within 90 Days', groups.d90, 'bdg-yellow')}
  </div>
  `;
};
function removeExpired(id){
  const m = state.meds.find(x=>x.id===id); if(!m) return;
  const reason = prompt('Reason for removal:', 'Expired stock');
  if(!reason) return;
  state.stockAdjustments.push({date:today(),medId:id,medName:m.name,qty:-m.qty,reason,value:m.qty*m.purchasePrice});
  m.qty = 0;
  audit('Remove Expired',m.name);
  saveState(); renderCurrent(); toast('Removed from stock','success');
}

function recordPayment(type, presetId){
  const list = type==='in'?state.customers:state.suppliers;
  const body = `<form id="payform" onsubmit="return savePayment(event,'${type}')">
    <div class="row cols-2">
      <div><label>Date</label><input type="date" name="date" value="${today()}" required></div>
      <div><label>${type==='in'?'Customer':'Supplier'}</label>
        <select name="party" required>
          ${list.map(p=>`<option value="${p.id}" ${presetId===p.id?'selected':''}>${escapeHtml(p.name)} — Bal: ${fmt(p.balance||0)}</option>`).join('')}
        </select>
      </div>
      <div><label>Amount (₨)</label><input type="number" min="0" step="0.01" name="amount" required></div>
      <div><label>Method</label><select name="method">${['Cash','Bank Transfer','Cheque','Card','Online'].map(x=>`<option>${x}</option>`).join('')}</select></div>
    </div>
    <div><label>Reference No</label><input name="reference" placeholder="Cheque/Txn #"></div>
    <div><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
  </form>`;
  openModal(`Record Payment ${type==='in'?'from Customer':'to Supplier'}`, body, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="document.getElementById('payform').requestSubmit()">Save</button>
  `);
}
function savePayment(e, type){
  e.preventDefault();
  const f = e.target;
  const amt = parseFloat(f.amount.value);
  const partyId = f.party.value;
  if(type==='in'){
    const c = state.customers.find(x=>x.id===partyId);
    if(!c) return false;
    c.balance = Math.max(0,(c.balance||0)-amt);
    state.paymentsIn.unshift({id:nextId('PIN-','payInCounter'),date:f.date.value,customer:c.id,customerName:c.name,amount:amt,method:f.method.value,reference:f.reference.value,notes:f.notes.value,createdAt:now()});
    audit('Payment Received', `${c.name} ${fmt(amt)}`);
  } else {
    const s = state.suppliers.find(x=>x.id===partyId);
    if(!s) return false;
    s.balance = Math.max(0,(s.balance||0)-amt);
    state.paymentsOut.unshift({id:nextId('POUT-','payOutCounter'),date:f.date.value,supplier:s.id,supplierName:s.name,amount:amt,method:f.method.value,reference:f.reference.value,notes:f.notes.value,createdAt:now()});
    audit('Payment Made', `${s.name} ${fmt(amt)}`);
  }
  saveState(); closeModal(); toast('Payment recorded','success'); renderCurrent();
  return false;
}

pages.cash = ()=>{

  const exp = state.expenses.filter(e=>e.date===td && e.paymentMethod==='Cash').reduce((a,b)=>a+b.amount,0);
  const opening = state.cashRegister.date===td ? state.cashRegister.opening : 0;
  const inflow = cashIn + mixedCash + recv;
  const outflow = paidOut + purCash + exp;
  const closing = opening + inflow - outflow;
  return `

pages.profit = ()=>{
  const f = session.filters;
  const from = f.from||today().slice(0,8)+'01';
  const to = f.to||today();
  const sales = state.sales.filter(s=>s.date>=from && s.date<=to);
  const purchases = state.purchases.filter(p=>p.date>=from && p.date<=to);
  const expenses = state.expenses.filter(e=>e.date>=from && e.date<=to);
  const sReturns = state.salesReturns.filter(r=>r.date>=from && r.date<=to);
  const pReturns = state.purchaseReturns.filter(r=>r.date>=from && r.date<=to);

  const totalSales = sales.reduce((s,x)=>s+x.grandTotal,0);
  const salesReturnAmt = sReturns.reduce((s,x)=>s+x.totalRefund,0);
  const netSales = totalSales - salesReturnAmt;
  const cogs = sales.reduce((s,x)=>s+x.items.reduce((a,b)=>a+b.purchasePrice*b.qty,0),0);
  const purReturnAmt = pReturns.reduce((s,x)=>s+x.total,0);
  const netCost = cogs - purReturnAmt;
  const grossProfit = netSales - netCost;
  const gpMargin = netSales?(grossProfit/netSales)*100:0;
  const totExp = expenses.reduce((s,x)=>s+x.amount,0);
  const netProfit = grossProfit - totExp;
  const npMargin = netSales?(netProfit/netSales)*100:0;

  return `
  <h1 class="page-title">📉 Profit & Loss Statement</h1>
  <div class="toolbar">
    <input type="date" value="${from}" onchange="setFilter('from',this.value)">
    <input type="date" value="${to}" onchange="setFilter('to',this.value)">
    <button class="btn btn-secondary" onclick="setQuickRange('today')">Today</button>
    <button class="btn btn-secondary" onclick="setQuickRange('week')">This Week</button>
    <button class="btn btn-secondary" onclick="setQuickRange('month')">This Month</button>
    <button class="btn btn-secondary" onclick="setQuickRange('year')">This Year</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨 Print</button>
  </div>
  <div class="cards">
    ${dashCard('Net Sales',fmt(netSales),'Revenue','💰','gradient-green')}
    ${dashCard('Net Cost',fmt(netCost),'COGS','💸','gradient-red')}
    ${dashCard('Gross Profit',fmt(grossProfit),gpMargin.toFixed(1)+'% margin','📈',grossProfit>=0?'gradient-teal':'gradient-red')}
    ${dashCard('Total Expenses',fmt(totExp),fmtN(expenses.length)+' entries','📊','gradient-orange')}
    ${dashCard('Net Profit',fmt(netProfit),npMargin.toFixed(1)+'% margin','💵',netProfit>=0?'gradient-green':'gradient-red')}
  </div>
  <div class="panel">
    <div class="panel-h"><h3>Detailed P&L Statement (${fmtDate(from)} to ${fmtDate(to)})</h3></div>
    <table>
      <tr><td colspan="2" style="background:var(--bg);font-weight:700">REVENUE</td></tr>
      <tr><td>Total Sales</td><td class="t-r">${fmt(totalSales)}</td></tr>
      <tr><td>Less: Sales Returns</td><td class="t-r danger">-${fmt(salesReturnAmt)}</td></tr>
      <tr style="border-top:1px solid var(--primary)"><td><strong>Net Sales Revenue</strong></td><td class="t-r bold">${fmt(netSales)}</td></tr>
      <tr><td colspan="2" style="background:var(--bg);font-weight:700">COST</td></tr>
      <tr><td>Cost of Goods Sold</td><td class="t-r">${fmt(cogs)}</td></tr>
      <tr><td>Less: Purchase Returns</td><td class="t-r success-c">-${fmt(purReturnAmt)}</td></tr>
      <tr style="border-top:1px solid var(--primary)"><td><strong>Net Cost</strong></td><td class="t-r bold">${fmt(netCost)}</td></tr>
      <tr><td colspan="2" style="background:rgba(46,125,50,.1);font-weight:700">GROSS PROFIT</td></tr>
      <tr><td><strong>Gross Profit</strong></td><td class="t-r bold ${grossProfit>=0?'success-c':'danger'}" style="font-size:16px">${fmt(grossProfit)} (${gpMargin.toFixed(2)}%)</td></tr>
      <tr><td colspan="2" style="background:var(--bg);font-weight:700">EXPENSES</td></tr>
      <tr><td>Operating Expenses</td><td class="t-r">${fmt(totExp)}</td></tr>
      <tr style="background:rgba(46,125,50,.15);border-top:2px solid var(--primary)"><td><strong style="font-size:18px">NET PROFIT</strong></td><td class="t-r bold ${netProfit>=0?'success-c':'danger'}" style="font-size:18px">${fmt(netProfit)} (${npMargin.toFixed(2)}%)</td></tr>
    </table>
  </div>`;
};
function setQuickRange(type){
  const d = new Date(); let from=today(), to=today();
  if(type==='week'){ const day=d.getDay(); d.setDate(d.getDate()-day); from=d.toISOString().slice(0,10); }
  else if(type==='month'){ from=today().slice(0,8)+'01'; }
  else if(type==='year'){ from=today().slice(0,4)+'-01-01'; }
  session.filters.from=from; session.filters.to=to;
  renderCurrent();
}

  </div>
  <div class="row cols-3">

      <div class="panel-h"><h3>📥 Backup</h3></div>
      <div class="panel-b">
        <p>Download a complete backup of all your data.</p>
        <button class="btn btn-primary mt-2" onclick="doBackup()">⬇ Download Backup (JSON)</button>
        <p class="small muted mt-2">Reminder every <strong>${state.settings.autoBackupDays}</strong> days. Configure in Settings.</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>📤 Restore</h3></div>
      <div class="panel-b">
        <p>Restore from a previously downloaded backup file.</p>
        <input type="file" id="restore-file" accept=".json" class="mt-2">
        <div class="mt-2">
          <button class="btn btn-warning" onclick="doRestore('replace')">Replace All Data</button>
          <button class="btn btn-secondary" onclick="doRestore('merge')">Merge Data</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>🗑️ Reset</h3></div>
      <div class="panel-b">
        <p class="danger">Delete ALL data and start fresh.</p>
        <button class="btn btn-danger mt-2" onclick="doReset()">Reset All Data</button>
      </div>
    </div>
  </div>
  `;

function doBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `PharmacyBackup_${ts}.json`;
  a.click();
  state.settings.lastBackup = today();
  audit('Backup',`${(data.length/1024).toFixed(1)}KB`);
  saveState();
  toast(`Backup downloaded — ${(data.length/1024).toFixed(1)}KB, ${state.meds.length} meds, ${state.sales.length} sales`,'success');
  renderCurrent();
}
function doRestore(mode){
  const f = $('restore-file').files[0];
  if(!f){ toast('Select a backup file first','warn'); return; }
  if(!confirm(`This will ${mode==='replace'?'REPLACE':'MERGE'} all current data. Continue?`)) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(mode==='replace'){
        state = Object.assign(DEFAULT_STATE(), data);
      } else {
        // Merge: append items by ID
        ['meds','sales','purchases','suppliers','customers','expenses','paymentsIn','paymentsOut'].forEach(k=>{
          if(Array.isArray(data[k])){
            data[k].forEach(item=>{
              if(!state[k].some(x=>x.id===item.id)) state[k].push(item);
            });
          }
        });
      }
      saveState();
      audit('Restore',mode);
      toast(`Restored ${data.meds?.length||0} meds, ${data.sales?.length||0} sales`,'success');
      setTimeout(()=>location.reload(),800);
    }catch(err){ toast('Invalid backup file','error'); }
  };
  r.readAsText(f);
}
function doReset(){
  const c = prompt('Type "RESET" to confirm:');
  if(c==='RESET'){
    localStorage.removeItem(LS_KEY);
    toast('All data reset','success');
    setTimeout(()=>location.reload(),500);
  }
}
