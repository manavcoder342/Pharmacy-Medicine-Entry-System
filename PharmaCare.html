  } else if(section==='invoice'){
    s.invoicePrefix=f.invoicePrefix.value; s.invoiceFormat=f.invoiceFormat.value; s.defaultTax=parseFloat(f.defaultTax.value)||0;
    s.showBatch=f.showBatch.value==='true'; s.showExpiry=f.showExpiry.value==='true'; s.showDiscount=f.showDiscount.value==='true'; s.showGeneric=f.showGeneric.value==='true';
    s.invoiceFooter=f.invoiceFooter.value; s.returnPolicy=f.returnPolicy.value;
  } else if(section==='app'){
    s.currency=f.currency.value; s.dateFormat=f.dateFormat.value;
    s.lowStockThreshold=parseInt(f.lowStockThreshold.value)||10;
    s.nearExpiryDays=parseInt(f.nearExpiryDays.value)||30;
    s.sounds=f.sounds.value==='true'; s.autoBackupDays=parseInt(f.autoBackupDays.value)||7;
  }
  audit('Update Settings', section);
  saveState(); toast('Settings saved','success');
  $('header-pname').textContent = s.pname;
  $('brand-name').textContent = s.pname;
  $('login-pname').textContent = s.pname;
  return false;
}
function addCategory(){ const v = $('new-cat').value.trim(); if(v && !state.categories.includes(v)){ state.categories.push(v); saveState(); renderCurrent(); } }
function delCategory(c){ state.categories = state.categories.filter(x=>x!==c); saveState(); renderCurrent(); }
function addUnit(){ const v = $('new-unit').value.trim(); if(v && !state.units.includes(v)){ state.units.push(v); saveState(); renderCurrent(); } }
function delUnit(c){ state.units = state.units.filter(x=>x!==c); saveState(); renderCurrent(); }
function addExpCat(){ const v = $('new-expcat').value.trim(); if(v && !state.expenseCategories.includes(v)){ state.expenseCategories.push(v); saveState(); renderCurrent(); } }
function delExpCat(c){ state.expenseCategories = state.expenseCategories.filter(x=>x!==c); saveState(); renderCurrent(); }

/* === Notifications === */
function checkNotifs(){
  const list = [];
  state.meds.forEach(m=>{
    const d = daysBetween(m.expiry);
    if(d<0) list.push({type:'danger',ico:'⏰',msg:`${m.name} expired (${fmtDate(m.expiry)})`});
    else if(d<=state.settings.nearExpiryDays) list.push({type:'warn',ico:'⚠️',msg:`${m.name} expires in ${d} days`});
    if(m.qty<=0) list.push({type:'danger',ico:'📭',msg:`${m.name} is OUT OF STOCK`});
    else if(m.qty<=(m.minStock||state.settings.lowStockThreshold)) list.push({type:'warn',ico:'📉',msg:`${m.name} - low stock (${m.qty} left)`});
  });
  state.customers.forEach(c=>{ if(c.balance>5000) list.push({type:'info',ico:'💰',msg:`${c.name} has pending balance ${fmt(c.balance)}`}); });
  if(state.settings.lastBackup){
    const d = Math.floor((new Date(today())-new Date(state.settings.lastBackup))/(1000*3600*24));
    if(d>=state.settings.autoBackupDays) list.push({type:'info',ico:'💾',msg:`Backup reminder: last backup ${d} days ago`});
  } else {
    list.push({type:'info',ico:'💾',msg:'No backup yet — backup your data!'});
  }
  state.notifications = list.slice(0,40);
  $('notif-count').textContent = list.length;
  $('notif-count').classList.toggle('hidden', list.length===0);
  $('notif-body').innerHTML = list.map(n=>`<div class="notif-item ${n.type}"><span class="nico">${n.ico}</span><div>${escapeHtml(n.msg)}</div></div>`).join('') || '<div class="empty">All clear!</div>';
}
function toggleNotif(){ $('notif-panel').classList.toggle('open'); }

/* === Calculator === */
let calcState = {expr:'',display:'0'};
function toggleCalc(){ $('calc-panel').classList.toggle('open'); }
function calcKey(k){
  if(k==='C'){ calcState={expr:'',display:'0'}; }
  else if(k==='CE'){ calcState.expr = calcState.expr.slice(0,-1); calcState.display = calcState.expr||'0'; }
  else if(k==='='){ try{ const v = Function('"use strict";return ('+calcState.expr.replace(/[^0-9+\-*/().% ]/g,'')+')')(); calcState.display = String(v); calcState.expr = String(v); }catch(e){ calcState.display='Error'; calcState.expr=''; } }
  else { calcState.expr += k; calcState.display = calcState.expr; }
  $('calc-disp').textContent = calcState.display;
}

/* === Global Search === */
function globalSearch(q){
  const r = $('g-results');
  if(!q || q.length<1){ r.classList.remove('open'); return; }
  const ql = q.toLowerCase();
  const matches = state.meds.filter(m =>
    (m.name||'').toLowerCase().includes(ql) ||
    (m.generic||'').toLowerCase().includes(ql) ||
    (m.barcode||'').toLowerCase().includes(ql)
  ).slice(0,8);
  r.innerHTML = matches.map(m=>`<div class="item" onclick="closeSearch();medView('${m.id}')"><strong>${escapeHtml(m.name)}</strong> <span class="muted small">${escapeHtml(m.generic||'')}</span><br><span class="small">Stock: ${m.qty} • ${fmt(m.sellPrice)} • Exp: ${fmtDate(m.expiry)}</span></div>`).join('') || '<div class="item muted">No medicines found</div>';
  r.classList.add('open');
}
function closeSearch(){ $('g-results').classList.remove('open'); $('g-search').value=''; }

/* === Login & Lock === */
function lockScreen(){
  if(!state.settings.loginEnabled){ toast('Enable login in Settings first','info'); return; }
  session.locked = true;
  $('app').classList.add('hidden');
  $('login-screen').classList.remove('hidden');
}
function doLogin(){
  const u = $('login-user').value;
  const p = $('login-pass').value;
  if(state.settings.loginEnabled){
    if(u !== state.settings.username || btoa(p) !== state.settings.password){
      toast('Invalid credentials','error'); return;
    }
  }
  session.locked = false;
  $('login-screen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('login-pass').value='';
  toast('Welcome back!','success');
}
function showHint(){
  const el = $('login-hint');
  if(state.settings.hint){ el.textContent='Hint: '+state.settings.hint; el.style.display='block'; }
  else { toast('No hint set','info'); }
}

/* === Setup Wizard === */
function showWizard(){
  let step = 1;
  const render = ()=>{
    let body = '';
    if(step===1){
      body = `<h3>Step 1: Pharmacy Info</h3>
      <div class="row cols-2 mt-2">
        <div><label>Pharmacy Name</label><input id="wz-pname" value="${escapeHtml(state.settings.pname)}"></div>
        <div><label>Phone</label><input id="wz-phone" value="${escapeHtml(state.settings.phone)}"></div>
      </div>
      <div><label>Address</label><textarea id="wz-address" rows="2">${escapeHtml(state.settings.address)}</textarea></div>`;
    } else if(step===2){
      body = `<h3>Step 2: Login (Optional)</h3>
      <p class="muted">Enable login to protect your pharmacy data.</p>
      <div class="row cols-2 mt-2">
        <div><label>Enable Login</label><select id="wz-loginEnabled"><option value="false">No, skip</option><option value="true">Yes</option></select></div>
        <div><label>Username</label><input id="wz-username"></div>
        <div><label>Password</label><input type="password" id="wz-password"></div>
      </div>`;
    } else if(step===3){
      body = `<h3>Step 3: Invoice Format</h3>
      <p class="muted">Choose how invoices print.</p>
      <select id="wz-format" style="max-width:300px"><option value="A4">A4 (Standard Page)</option><option value="Thermal">Thermal Receipt</option></select>`;
    } else if(step===4){
      body = `<h3>Step 4: Sample Data</h3>
      <p>Load 15 sample medicines, suppliers, and customers to explore?</p>
      <div class="mt-2">
        <button class="btn btn-primary" onclick="finishWizard(true)">Yes, load sample data</button>
        <button class="btn btn-secondary" onclick="finishWizard(false)">No, start fresh</button>
      </div>`;
    }
    const prog = `<div class="wizard-prog">${[1,2,3,4].map(i=>`<div class="s ${step>i?'done':step===i?'active':''}">${step>i?'✓':i}</div>`).join('')}</div>`;
    const footer = step<4?`<button class="btn btn-secondary" onclick="closeModal()">Skip</button>${step>1?'<button class="btn btn-secondary" onclick="wizardStep(-1)">← Back</button>':''}<button class="btn btn-primary" onclick="wizardStep(1)">Next →</button>`:'';
    openModal('Welcome to PharmaCare 👋', prog+`<div class="wizard-step">${body}</div>`, footer);
  };
  window.wizardStep = (delta)=>{
    if(delta>0){
      if(step===1){ state.settings.pname = $('wz-pname').value||state.settings.pname; state.settings.phone = $('wz-phone').value||state.settings.phone; state.settings.address = $('wz-address').value||state.settings.address; }
      if(step===2){ state.settings.loginEnabled = $('wz-loginEnabled').value==='true'; state.settings.username = $('wz-username').value; if($('wz-password').value) state.settings.password = btoa($('wz-password').value); }
      if(step===3){ state.settings.invoiceFormat = $('wz-format').value; }
    }
    step += delta;
    saveState();
    render();
  };
  window.finishWizard = (loadSample)=>{
    if(loadSample) loadSampleData(true);
    state.setup = true;
    saveState();
    closeModal();
    $('header-pname').textContent = state.settings.pname;
    $('brand-name').textContent = state.settings.pname;
    toast('Setup complete!','success');
    go('dashboard');
  };
  render();
}

/* === Keyboard Shortcuts === */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('modal-bg').classList.contains('open')) closeModal(); $('notif-panel').classList.remove('open'); $('calc-panel').classList.remove('open'); }
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA' || e.target.tagName==='SELECT') return;
  if(e.key==='F1'){ e.preventDefault(); go('dashboard'); }
  if(e.key==='F2'){ e.preventDefault(); go('pos'); }
  if(e.key==='F3'){ e.preventDefault(); go('purchases'); }
  if(e.key==='F4'){ e.preventDefault(); $('g-search').focus(); }
  if(e.key==='F5'){ e.preventDefault(); go('reports'); }
  if(e.ctrlKey && e.key==='p'){ e.preventDefault(); window.print(); }
});

/* === Init === */
function init(){
  applyTheme();
  $('header-pname').textContent = state.settings.pname;
  $('brand-name').textContent = state.settings.pname;
  $('login-pname').textContent = state.settings.pname;
  tickClock();
  if(state.settings.loginEnabled && state.settings.password){
    session.locked = true;
    $('login-screen').classList.remove('hidden');
  } else {
    $('app').classList.remove('hidden');
    renderNav();
    if(!state.setup){ go('dashboard'); setTimeout(showWizard,500); }
    else go('dashboard');
    checkNotifs();
    setInterval(checkNotifs, 60000);
  }
}
// Show app after login
const _orig = doLogin;

  if(!session.locked){
    renderNav();
    if(!state.setup){ go('dashboard'); setTimeout(showWizard,500); }
    else go('dashboard');
    checkNotifs();
  }
};
